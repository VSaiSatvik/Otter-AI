<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otter AI - Your Underwater Friend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ocean Background -->
    <div class="ocean">
        <div class="water-surface"></div>
        <div class="bubble-container" id="bubbleContainer"></div>
        <div class="fish-container" id="fishContainer"></div>
        <div class="seaweed-left"></div>
        <div class="seaweed-right"></div>
        <div class="sand-bottom"></div>
        
        <!-- Light rays from above -->
        <div class="light-rays">
            <div class="ray ray-1"></div>
            <div class="ray ray-2"></div>
            <div class="ray ray-3"></div>
        </div>
        
        <!-- The Otter -->
        <div class="otter-container" id="otterContainer">
            <div class="otter" id="otter">
                <!-- Otter Body -->
                <div class="otter-body">
                    <!-- Head -->
                    <div class="otter-head">
                        <div class="otter-face">
                            <!-- Ears -->
                            <div class="ear left-ear"></div>
                            <div class="ear right-ear"></div>
                            <!-- Eyes -->
                            <div class="otter-eyes">
                                <div class="otter-eye left-otter-eye">
                                    <div class="otter-pupil"></div>
                                </div>
                                <div class="otter-eye right-otter-eye">
                                    <div class="otter-pupil"></div>
                                </div>
                            </div>
                            <!-- Nose -->
                            <div class="otter-nose"></div>
                            <!-- Mouth -->
                            <div class="otter-mouth" id="otterMouth">
                                <div class="otter-smile"></div>
                            </div>
                            <!-- Whiskers -->
                            <div class="whiskers left-whiskers">
                                <div class="whisker"></div>
                                <div class="whisker"></div>
                                <div class="whisker"></div>
                            </div>
                            <div class="whiskers right-whiskers">
                                <div class="whisker"></div>
                                <div class="whisker"></div>
                                <div class="whisker"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Body -->
                    <div class="otter-body-section">
                        <!-- Arms -->
                        <div class="arm left-arm">
                            <div class="paw"></div>
                        </div>
                        <div class="arm right-arm">
                            <div class="paw"></div>
                        </div>
                        <!-- Belly -->
                        <div class="otter-belly"></div>
                    </div>
                    <!-- Tail -->
                    <div class="otter-tail" id="otterTail"></div>
                </div>
                <!-- Floating bubbles from otter -->
                <div class="otter-bubbles" id="otterBubbles"></div>
            </div>
            
            <!-- Emotion indicator -->
            <div class="otter-emotion" id="otterEmotion">😊</div>
            
            <!-- Speech bubble -->
            <div class="speech-bubble" id="speechBubble">
                <div class="speech-content" id="speechContent"></div>
            </div>
        </div>
        
        <!-- Chat Interface -->
        <div class="chat-panel">
            <div class="chat-header">
                <span class="otter-name">Otter</span>
                <span class="status-dot"></span>
                <span class="status-text">Swimming nearby...</span>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message otter-message">
                    <div class="message-content">
                        <span class="message-text">Hello! I'm an otter! Want to swim with me? 🦦</span>
                    </div>
                </div>
            </div>
            
            <div class="chat-input">
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Type underwater..." autocomplete="off">
                    <button id="sendBtn" class="send-btn">
                        <span class="send-icon">➤</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
