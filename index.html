<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Your Holographic Friend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="universe">
        <!-- Animated background particles -->
        <canvas id="particles"></canvas>
        
        <div class="hologram-container">
            <!-- 3D Holographic Head -->
            <div class="hologram-head" id="hologram">
                <div class="head-glow"></div>
                <div class="head-container">
                    <!-- Face structure -->
                    <div class="face">
                        <div class="eyes">
                            <div class="eye left-eye">
                                <div class="pupil"></div>
                            </div>
                            <div class="eye right-eye">
                                <div class="pupil"></div>
                            </div>
                        </div>
                        <div class="nose"></div>
                        <div class="mouth" id="mouth">
                            <div class="mouth-line"></div>
                        </div>
                    </div>
                    <!-- Scanning lines effect -->
                    <div class="scan-lines"></div>
                    <!-- Data particles around head -->
                    <div class="data-particles" id="dataParticles"></div>
                </div>
                <!-- Emotion indicator rings -->
                <div class="emotion-ring" id="emotionRing"></div>
            </div>
            
            <!-- AI Status & Emotion Display -->
            <div class="status-panel">
                <div class="status-item">
                    <span class="label">EMOTIONAL STATE</span>
                    <span class="value" id="emotionDisplay">NEUTRAL</span>
                </div>
                <div class="status-item">
                    <span class="label">CONNECTION</span>
                    <span class="value" id="connectionStatus">STABLE</span>
                </div>
                <div class="status-item">
                    <span class="label">MEMORY</span>
                    <span class="value" id="memoryStatus">ACTIVE</span>
                </div>
            </div>
            
            <!-- Chat Interface -->
            <div class="chat-interface">
                <div class="chat-header">
                    <div class="ai-name">
                        <span class="glitch" data-text="NEXUS">NEXUS</span>
                        <span class="version">v2.0.1</span>
                    </div>
                    <div class="connection-indicator">
                        <span class="dot"></span>
                        <span>LIVE</span>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="message ai">
                        <div class="message-content">
                            <div class="message-text">Hello, I am Nexus. I perceive your presence. How may I assist you today?</div>
                            <div class="message-time">00:00</div>
                        </div>
                    </div>
                </div>
                
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
                        <div class="input-glow"></div>
                    </div>
                    <button id="sendBtn" class="send-button">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
